name: Telegram notify

# Run this workflow every time someone pushes to the repo
on:
  push:

jobs:
  notify:
    # Skip when the push only deleted a branch (there are no commits to show)
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Send push summary to Telegram
        # Values go in as environment variables, not pasted into the script.
        # This is safer: text from a commit message can never run as code.
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          # One line per commit: a clickable short id that opens the commit on GitHub,
          # then the first line of the message. @html escapes < > & so Telegram
          # can't mistake text in a commit message for HTML tags.
          COMMITS=$(jq -r '.commits[] | "• <a href=\"" + .url + "\">" + .id[0:7] + "</a> " + (.message | split("\n")[0] | @html)' "$GITHUB_EVENT_PATH")
          COUNT=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          # Same escaping for the branch name
          BRANCH_HTML=$(jq -rn --arg v "$BRANCH" '$v | @html')

          TEXT=$(printf 'Saffayna: %s commit(s) pushed to %s\n\n%s\n\n<a href="%s">View all changes</a>' "$COUNT" "$BRANCH_HTML" "$COMMITS" "$COMPARE_URL")

          curl -sS --fail -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            --data-urlencode "text=${TEXT}"