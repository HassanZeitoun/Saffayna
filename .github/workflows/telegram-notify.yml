name: Telegram notify

# Run this workflow every time someone pushes to the repo
on:
  push:

jobs:
  notify:
    # Skip when the push only deleted a branch (there are no commits to show)
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Send push summary to Telegram
        # Values go in as environment variables, not pasted into the script.
        # This is safer: text from a commit message can never run as code.
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          # jq reads the push details GitHub saves in $GITHUB_EVENT_PATH
          # and builds one line per commit: short id + first line of the message
          COMMITS=$(jq -r '.commits[] | "• " + .id[0:7] + " " + (.message | split("\n")[0])' "$GITHUB_EVENT_PATH")
          COUNT=$(jq '.commits | length' "$GITHUB_EVENT_PATH")

          TEXT=$(printf 'Saffayna: %s commit(s) pushed to %s\n\n%s\n\n%s' "$COUNT" "$BRANCH" "$COMMITS" "$COMPARE_URL")

          # Call the Telegram Bot API; --data-urlencode safely encodes the text
          curl -sS --fail -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"